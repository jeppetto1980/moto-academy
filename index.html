<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="description" content="Moto Academy: impara come funziona una moto con animazioni 3D." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Moto Academy</title>
    <style>
      #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:radial-gradient(900px 500px at 50% 0%,#23293a 0%,#0d0f14 65%);color:#e9edf5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease,visibility .45s}
      #boot.out{opacity:0;visibility:hidden}
      #boot .ld-title{font-weight:800;font-size:26px;letter-spacing:.3px}
      #boot .ld-title b{color:#ff6a1a}
      .ld-bike{width:min(72vw,300px);height:auto;color:#e9edf5;overflow:visible}
      .ld-anim{animation:ldBounce .5s ease-in-out infinite alternate}
      .ld-spin{transform-box:fill-box;transform-origin:center;animation:ldSpin .45s linear infinite}
      .ld-road{animation:ldRoad .5s linear infinite}
      .ld-wind{animation:ldWind .6s linear infinite}
      .ld-fill{transition:width .25s ease}
      .ld-bar{width:min(72vw,300px);height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
      .ld-bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ff6a1a,#ffb03a);transition:width .25s ease;box-shadow:0 0 12px #ff6a1a88}
      .ld-row{display:flex;justify-content:space-between;width:min(72vw,300px);font-size:13px;color:#9aa3b5;margin-top:-8px}
      .ld-row span:last-child{font-variant-numeric:tabular-nums;color:#ffb03a;font-weight:700}
      @keyframes ldSpin{to{transform:rotate(360deg)}}
      @keyframes ldBounce{from{transform:translateY(0)}to{transform:translateY(-2px)}}
      @keyframes ldRoad{to{stroke-dashoffset:24}}
      @keyframes ldWind{from{transform:translateX(8px);opacity:.5}to{transform:translateX(-10px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.ld-spin,.ld-road,.ld-wind,.ld-anim{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="progressbar" aria-label="Caricamento">
      <div class="ld-title">Moto <b>Academy</b></div>
      <svg class="ld-bike ld-anim" viewBox="0 0 200 112" aria-hidden="true">
  <defs>
    <linearGradient id="ldgB" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff6a1a"/><stop offset="1" stop-color="#ffb03a"/>
    </linearGradient>
    <clipPath id="ldcB">
      <path d="M14 42 L30 39 L66 43 L78 31 Q96 23 116 26 L130 32 L142 39 L147 50 L132 52 L121 50 L117 70 Q100 79 84 73 L76 57 L60 55 L40 51 Z"/>
      <circle cx="42" cy="80" r="24"/><circle cx="160" cy="80" r="24"/>
      <path d="M42 80 L86 66 L90 72 L44 86 Z"/><path d="M138 40 L163 80 L157 82 L133 43 Z"/>
      <path d="M96 74 L150 66 L152 72 L100 80 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ldcB)">
    <rect x="0" y="0" width="200" height="112" fill="currentColor" opacity=".13"/>
    <rect class="ld-fill" x="0" y="0" width="0" height="112" fill="url(#ldgB)"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".85">
    <path d="M14 42 L30 39 L66 43 L78 31 Q96 23 116 26 L130 32 L142 39 L147 50 L132 52 L121 50 L117 70 Q100 79 84 73 L76 57 L60 55 L40 51 Z"/>
    <circle cx="42" cy="80" r="24"/><circle cx="160" cy="80" r="24"/>
    <path d="M42 80 L88 69"/><path d="M135 41 L160 80"/><path d="M98 77 L151 69"/>
    <path d="M131 33 L126 21 L138 17"/>
  </g>
  <g class="ld-spin" stroke="currentColor" stroke-width="1.6" opacity=".7">
    <circle cx="42" cy="80" r="15" fill="none" stroke-dasharray="3 4"/>
    <path d="M42 66 V94 M28 80 H56 M32 70 L52 90 M52 70 L32 90"/>
  </g>
  <g class="ld-spin" stroke="currentColor" stroke-width="1.6" opacity=".7">
    <circle cx="160" cy="80" r="15" fill="none" stroke-dasharray="3 4"/>
    <path d="M160 66 V94 M146 80 H174 M150 70 L170 90 M170 70 L150 90"/>
  </g>
  <line class="ld-road" x1="-20" y1="107" x2="220" y2="107" stroke="currentColor" stroke-width="2.5" stroke-dasharray="14 10" opacity=".35"/>
  <g class="ld-wind" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".4">
    <path d="M2 30 H10"/><path d="M0 58 H8"/><path d="M4 70 H12"/>
  </g>
</svg>
      <div class="ld-bar"><i></i></div>
      <div class="ld-row"><span id="ld-tip">Scaldo il motore…</span><span id="ld-pct">0%</span></div>
    </div>
    <script>
      (function(){
        var el=document.getElementById('boot'),fill=el.querySelector('.ld-fill'),bar=el.querySelector('.ld-bar i'),pct=document.getElementById('ld-pct'),tip=document.getElementById('ld-tip');
        var tips=['Scaldo il motore…','Controllo le gomme…','Tendo la catena…','Lucido le cromature…','Accendo le luci dell\u2019officina…','Monto le pinze freno…'];
        var p=0,ti=0,done=false;
        function set(v){p=v;fill.setAttribute('width',(v*2).toFixed(1));bar.style.width=v+'%';pct.textContent=Math.round(v)+'%';el.setAttribute('aria-valuenow',Math.round(v))}
        var t=setInterval(function(){if(!done)set(p+(92-p)*0.05)},120);
        var tt=setInterval(function(){ti=(ti+1)%tips.length;tip.textContent=tips[ti]},1500);
        window.addEventListener('load',function(){if(!done&&p<55)set(55)});
        window.__bootDone=function(){if(done)return;done=true;clearInterval(t);clearInterval(tt);set(100);tip.textContent='Pronti, si parte!';
          setTimeout(function(){el.classList.add('out')},350);setTimeout(function(){el.remove()},900)};
        setTimeout(function(){window.__bootDone()},20000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
